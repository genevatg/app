<body>
<p>Opening Geneva Tagalog Group…</p>

<script>
(function () {
  const raw = location.search.slice(1);
  const p = new URLSearchParams(location.search);

  const token =
    p.get('token') ||
    p.get('volunteer') ||
    ((raw && !raw.includes('=')) ? decodeURIComponent(raw) : '');

  if (!token) {
    document.body.innerHTML = '<p>This link is incomplete.</p>';
    return;
  }

  location.replace('../?volunteer=' + encodeURIComponent(token));
})();
</script>
</body>
