<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geneva Tagalog Group – Public Talk Availability</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#f3f7fb;color:#142333;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.wrap{max-width:620px;margin:auto;padding:0 16px 50px}.brand{background:#123f68;color:#fff;padding:24px 20px;border-radius:0 0 24px 24px;margin:0 -16px 18px}.card{background:#fff;border:1px solid #dbe4ec;border-radius:18px;padding:16px;margin:12px 0}h1{font-size:27px;margin:5px 0}h2{font-size:20px}.muted,small{color:#6f7e8d}.field{width:100%;padding:13px;border:1px solid #cbd8e3;border-radius:12px;font-size:17px;margin:5px 0 12px}label{font-weight:700;display:block;margin-top:8px}.date{border:1px solid #d6e2ea;border-radius:15px;padding:13px;margin:9px 0}.modes{display:flex;gap:8px}.modes label{flex:1;border:1px solid #cbd8e3;border-radius:12px;padding:10px}.travel{display:none;background:#f6fafc;border-radius:12px;padding:10px}.primary{width:100%;border:0;border-radius:14px;padding:14px;background:#164f7d;color:#fff;font-size:18px;font-weight:800}.hidden{display:none!important}.ok{color:#197642;font-weight:700}.error{color:#a63b32}</style></head><body><div class="wrap"><div class="brand"><small style="color:#dce9f4">GENEVA TAGALOG GROUP</small><h1>Public Talk Availability</h1><div>Please indicate the dates on which you may be available.</div></div><div id="loading" class="card">Loading invitation…</div><form id="form" class="hidden" onsubmit="submitResponse(event)"><div class="card"><h2>Your details</h2><label>Full name</label><input id="name" class="field" required><label>Congregation</label><input id="cong" class="field" required><label>City</label><input id="city" class="field" required><label>Country</label><input id="country" class="field" required><label>Mobile / WhatsApp</label><input id="phone" class="field" required><label>Email <span class="muted">(optional)</span></label><input id="email" type="email" class="field"></div><div class="card"><h2>Available dates</h2><div class="muted">Choose In person or Zoom for each available date. Leave unselected if unavailable.</div><div id="dates"></div></div><div class="card"><h2>5 preferred talks</h2><div id="talkChoices"></div></div><div class="card"><button class="primary">Submit availability</button><div id="msg"></div></div></form></div><script>
const sb=supabase.createClient('https://evdffmuseekhplippthk.supabase.co','sb_publishable_Tv92ZKNYPNElO5O8t5M3CA_imYX4duu'),$=id=>document.getElementById(id),token=new URLSearchParams(location.search).get('token');let data;
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function init(){const r=await sb.rpc('speaker_portal_invitation',{p_token:token});if(r.error){$('loading').textContent=r.error.message;return}data=r.data;$('loading').remove();$('form').classList.remove('hidden');for(const [id,k] of [['name','full_name'],['cong','congregation'],['city','city'],['country','country'],['phone','phone'],['email','email']])$(id).value=data.speaker?.[k]||'';$('dates').innerHTML=(data.dates||[]).map(d=>`<div class="date"><b>${new Date(d.talk_date+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'long',year:'numeric'})}</b><div class="modes"><label><input type="radio" name="m_${d.public_talk_id}" value="in_person" onchange="travel('${d.public_talk_id}')"> In person</label><label><input type="radio" name="m_${d.public_talk_id}" value="zoom" onchange="travel('${d.public_talk_id}')"> Zoom</label></div><button type="button" onclick="clearM('${d.public_talk_id}')">Clear / unavailable</button><div id="t_${d.public_talk_id}" class="travel"><label>Travel</label><select class="field tm"><option>car</option><option>train</option><option>plane</option><option>other</option></select><label>How many people?</label><input class="field ps" type="number" min="1" value="1"><label>Accept congregation hospitality?</label><select class="field hp"><option value="yes">Yes</option><option value="no">No</option></select></div></div>`).join('');const opts='<option value="">Not selected</option>'+(data.talk_catalog||[]).map(t=>`<option value="${t.talk_number}">${t.talk_number} — ${esc(t.title||'')}</option>`).join('');$('talkChoices').innerHTML=[1,2,3,4,5].map(i=>`<select id="p${i}" class="field">${opts}</select>`).join('')}
function travel(id){$('t_'+id).style.display=document.querySelector(`input[name="m_${id}"]:checked`)?.value==='in_person'?'block':'none'}function clearM(id){document.querySelectorAll(`input[name="m_${id}"]`).forEach(x=>x.checked=false);travel(id)}
async function submitResponse(e){e.preventDefault();const rs=(data.dates||[]).map(d=>{const m=document.querySelector(`input[name="m_${d.public_talk_id}"]:checked`)?.value;if(!m)return null;const b=$('t_'+d.public_talk_id);return{public_talk_id:d.public_talk_id,delivery_method:m,travel_mode:m==='in_person'?b.querySelector('.tm').value:null,party_size:m==='in_person'?Number(b.querySelector('.ps').value):null,accept_hospitality:m==='in_person'?b.querySelector('.hp').value==='yes':null}}).filter(Boolean),tc=[1,2,3,4,5].map(i=>Number($('p'+i).value)).filter(Boolean);if(new Set(tc).size!==tc.length){$('msg').innerHTML='<p class="error">Please choose different talks.</p>';return}const r=await sb.rpc('speaker_portal_respond',{p_token:token,p_full_name:$('name').value,p_congregation:$('cong').value,p_city:$('city').value,p_country:$('country').value,p_phone:$('phone').value,p_email:$('email').value||null,p_talk_choices:tc,p_responses:rs});$('msg').innerHTML=r.error?`<p class="error">${esc(r.error.message)}</p>`:'<p class="ok">Thank you. Your availability has been sent to the Public Talk Coordinator.</p>'}
init()</script>
<div style="max-width:620px;margin:14px auto 28px;padding:0 16px;text-align:center;font:12px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif"><a href="privacy.html" target="_blank" rel="noopener" style="color:#285e91;font-weight:700">Privacy &amp; Data Use</a></div>
</body></html>
